<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar Rosto - FaceGallery</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">FaceGallery</h1>
            <ul class="nav-menu">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="publicar.html" class="active">Publicar Rosto</a></li>
                <li><a href="pesquisar.html">Pesquisar Rosto</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <header class="page-header">
            <h2>Publicar Novo Rosto</h2>
            <p>Faça upload de uma imagem para publicar no sistema</p>
        </header>

        <div class="form-container">
            <form id="publishForm">
                <div class="form-group">
                    <label for="nome">Nome da Pessoa (opcional)</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: João Silva">
                </div>

                <div class="form-group">
                    <label for="imagem">Imagem do Rosto *</label>
                    <input type="file" id="imagem" name="imagem" accept="image/*" required>
                    <small>Formatos suportados: JPG, PNG, GIF (max 5MB)</small>
                </div>

                <div id="previewContainer" class="preview-container">
                    <img id="preview" class="preview-image" style="display: none;" alt="Preview">
                </div>

                <button type="submit" class="btn btn-success">Publicar Rosto</button>
            </form>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="js/publicar.js"></script>
</body>
</html>
